<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Territorio 3D — Nuevo mundo</title><style>*{box-sizing:border-box}body{margin:0;background:#171d20;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#161c20dd;padding:12px;border-radius:10px;z-index:2}button{background:#37464b;color:white;border:1px solid #ffffff40;border-radius:7px;padding:8px}#status{position:fixed;bottom:14px;left:14px;max-width:90%;background:#161c20df;padding:10px;border-radius:7px;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><strong>TERRITORIO 3D · NUEVO MUNDO 0.002</strong><button id="day">Día / noche</button><button id="view">Vista urbana</button><button id="add">Construir vivienda</button><button id="reset">Reiniciar demo</button></header><div id="status">Iniciando nuevo motor gráfico…</div><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.querySelector('#status');
try{
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xa6c0d0);scene.fog=new T.FogExp2(0xa6c0d0,.0018);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,1200);camera.position.set(30,11,45);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.035;controls.minDistance=9;controls.maxDistance=160;
const sun=new T.DirectionalLight(0xffeed9,3.0);sun.position.set(-35,55,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-65,right:65,top:65,bottom:-65,near:1,far:150});sun.shadow.normalBias=.035;scene.add(sun);const sky=new T.HemisphereLight(0xc9e1ff,0x6a695d,1.4);scene.add(sky);
let loaded=0;const report=()=>status.textContent='Nuevo mundo · '+loaded+' recursos fotográficos cargados · arrastra para girar, pellizca para acercar';
const loader=new T.TextureLoader();const mats={};function material(color,roughness=.8,metalness=0){return new T.MeshStandardMaterial({color,roughness,metalness});}
async function photo(name,id,repeat){let m=mats[name];try{let response=await fetch('https://api.polyhaven.com/files/'+id);if(!response.ok)throw Error('HTTP '+response.status);let d=await response.json();await Promise.all(['diff','nor_gl','rough'].map(async k=>{let entry=d[k]?.['1k'];let url=entry?.jpg?.url||entry?.png?.url;if(!url)return;let tex=await loader.loadAsync(url);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(repeat,repeat);tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(k==='diff'){tex.colorSpace=T.SRGBColorSpace;m.map=tex;m.color.set(0xffffff);}else if(k==='nor_gl'){m.normalMap=tex;m.normalScale.set(.55,.55);}else m.roughnessMap=tex;m.needsUpdate=true;loaded++;report();}));}catch(e){console.warn(id,e);}}
Object.assign(mats,{grass:material(0x637b43),asphalt:material(0x44484a,.95),concrete:material(0xc0bcb2),stone:material(0x9a8d7b),roof:material(0x454a4a),metal:material(0x60676b,.32,.6),glass:material(0x38596b,.15,.25),dark:material(0x202c32),paint:material(0xf1f0e2),wood:material(0x806343),leaf:material(0x41612e),warm: new T.MeshStandardMaterial({color:0xbba27c,emissive:0xffbd73,emissiveIntensity:0})});
photo('grass','aerial_grass_rock',16);photo('asphalt','aerial_asphalt_01',5);photo('concrete','concrete_wall_001',2);photo('stone','stone_wall_02',2);
new RGBELoader().load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kiara_1_dawn_1k.hdr',hdr=>{hdr.mapping=T.EquirectangularReflectionMapping;scene.environment=hdr;scene.environmentIntensity=.65;loaded++;report();},undefined,()=>{});
function box(parent,x,y,z,w,h,d,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);o.castShadow=h>.15;o.receiveShadow=true;parent.add(o);return o;}
function plane(w,d,x,z,y,m){let o=new T.Mesh(new T.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o;}
plane(220,220,0,0,-.02,mats.grass);plane(120,12,0,0,0,mats.asphalt);plane(12,120,0,0,.005,mats.asphalt);
for(let s of [-1,1]){box(scene,0,0,s*7.1,120,.16,2.1,mats.concrete);box(scene,s*7.1,0,0,2.1,.16,120,mats.concrete);}
for(let i=-54;i<55;i+=5){if(Math.abs(i)<9)continue;plane(2.4,.11,i,0,.018,mats.paint);plane(.11,2.4,0,i,.019,mats.paint);}
const detail=material(0x696d69,.85),rubber=material(0x191c1e,.95),chrome=material(0x9ea4a9,.22,.85);
function car(x,z,angle,color){let g=new T.Group();g.position.set(x,.04,z);g.rotation.y=angle;scene.add(g);let paint=material(color,.24,.55);box(g,0,.40,0,1.8,.65,4.35,paint);box(g,0,1.05,-.13,1.65,.53,2.1,mats.glass);box(g,0,1.53,-.13,1.55,.09,1.5,paint);for(let a of [-1,1])for(let b of [-1,1]){let tire=new T.Mesh(new T.CylinderGeometry(.34,.34,.23,24),rubber);tire.rotation.z=Math.PI/2;tire.position.set(a*.86,.35,b*1.35);g.add(tire);let hub=new T.Mesh(new T.CylinderGeometry(.19,.19,.24,16),chrome);hub.rotation.z=Math.PI/2;hub.position.copy(tire.position);g.add(hub);}for(let a of [-1,1]){box(g,a*.61,.77,2.17,.43,.16,.045,mats.paint);box(g,a*.61,.75,-2.17,.43,.13,.045,material(0x9b1920,.35));}return g;}
for(let x of [-43,-34,29,39])car(x,3,Math.PI/2,({[-43]:0x313d49,[-34]:0xb8b8b2,29:0x7d2827,39:0x343a38})[x]);for(let z of [-38,33])car(-3,z,0,0x555d64);
for(let s of [-1,1])for(let k=-48;k<49;k+=2.5){if(Math.abs(k)<10)continue;box(scene,k,.15,s*6.08,2.47,.10,.23,detail);box(scene,s*6.08,.15,k,.23,.10,2.47,detail);}
for(let s of [-1,1])for(let j=0;j<7;j++){plane(.52,3.8,-4.4+j*1.46,s*8.5,.175,mats.paint);}
const windows=[];function building(x,z,w,d,floors,style=0){let g=new T.Group();scene.add(g);g.position.set(x,0,z);let h=floors*3.1;box(g,0,0,0,w,.25,d,mats.stone);box(g,0,.25,0,w-.65,h,d-.65,mats.dark);const wall=style===1?mats.stone:mats.concrete;for(let f=0;f<floors;f++){let y=.25+f*3.1;box(g,0,y,0,w,.62,d,wall);for(let side of [-1,1]){let n=Math.max(2,Math.floor(w/2.1));for(let j=0;j<n;j++){let px=-w/2+(j+.5)*w/n;box(g,px,y+.62,side*(d/2-.16),w/n-.20,2.38,.12,mats.glass);if((j+f*3)%5===0){let o=box(g,px,y+.78,side*(d/2-.08),w/n-.40,1.95,.025,mats.warm);windows.push(o);}box(g,px-w/n*.48,y+.62,side*d/2,.12,2.48,.20,mats.metal);box(g,px,y+2.10,side*d/2,w/n-.18,.06,.15,mats.metal);}let n2=Math.max(2,Math.floor(d/2.1));for(let j=0;j<n2;j++){let pz=-d/2+(j+.5)*d/n2;box(g,side*(w/2-.16),y+.62,pz,.12,2.38,d/n2-.20,mats.glass);box(g,side*w/2,y+.62,pz-d/n2*.48,.20,2.48,.12,mats.metal);}}}for(let f=1;f<floors;f++){let y=f*3.1+.25;if(style===1){for(let j=0;j<Math.floor(w/4);j++){let px=-w/2+2+j*4;box(g,px,y,d/2+.63,3.1,.18,1.35,mats.concrete);for(let s of [-1,1])box(g,px+s*1.45,y+.18,d/2+.65,.07,.95,1.25,mats.metal);box(g,px,y+.18,d/2+1.24,2.9,.86,.055,mats.glass);box(g,px,y+1.04,d/2+1.24,3,.07,.09,mats.metal);}}}
box(g,0,h+.25,0,w+.12,.18,d+.12,mats.roof);for(let s of [-1,1]){box(g,0,h+.43,s*(d/2-.10),w,.45,.20,wall);box(g,s*(w/2-.10),h+.43,0,.20,.45,d,wall);}box(g,0,h+.43,d*.18,w*.31,.75,d*.20,mats.metal);for(let k=0;k<4;k++){let x=-w*.32+k*w*.21;box(g,x,h+.44,-d*.20,1.2,.56,1.1,mats.metal);for(let q=0;q<5;q++)box(g,x-.43+q*.20,h+1.0,-d*.20,.065,.025,.85,mats.dark);}box(g,0,2.65,d/2+1.25,Math.min(w*.62,8),.22,2.7,mats.metal);for(let s of [-1,1])box(g,s*Math.min(w*.25,3),0,d/2+2.3,.16,2.65,.16,mats.metal);return g;}
building(-19,-18,17,14,4);building(20,-19,16,14,3,1);building(-19,19,15,12,2,1);building(20,19,15,12,3);
const added=[];let n=0;document.querySelector('#add').onclick=()=>{if(n>=8){status.textContent='Límite de viviendas de esta demo';return;}added.push(building(-42+(n%2)*84, -40+Math.floor(n/2)*24,10,9,2+(n%2),1));n++;};
document.querySelector('#reset').onclick=()=>{for(const g of added)scene.remove(g);added.length=0;n=0;};
const lights=[];for(let i=-42;i<=42;i+=14){if(Math.abs(i)<9)continue;for(let s of [-1,1]){let z=s*7.7;box(scene,i,.16,z,.13,6,.13,mats.metal);box(scene,i,6.1,z-s*.8,.16,.13,1.65,mats.metal);box(scene,i,6.02,z-s*1.6,.38,.09,.65,mats.warm);let l=new T.SpotLight(0xffe6be,0,25,Math.PI/3,.55,2);l.position.set(i,6,z-s*1.6);l.target.position.set(i,0,z-s*4);scene.add(l,l.target);lights.push(l);}}
let rng=123;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296;}const treeGeo=new T.IcosahedronGeometry(1,2);for(let i=0;i<36;i++){let x=(i%2?1:-1)*(33+rand()*19),z=(rand()-.5)*95;let height=3+rand()*3;let trunk=new T.Mesh(new T.CylinderGeometry(.10,.18,height,9),mats.wood);trunk.position.set(x,height/2,z);trunk.castShadow=true;scene.add(trunk);for(let j=0;j<7;j++){let o=new T.Mesh(treeGeo,mats.leaf);o.position.set(x+(rand()-.5)*2,height+(rand()-.3)*2,z+(rand()-.5)*2);o.scale.set(1.0+rand()*.7,.9+rand()*1.1,1.0+rand()*.7);o.castShadow=true;o.receiveShadow=true;scene.add(o);}}
const gltf=new GLTFLoader();async function naturalTrees(){try{const list=await fetch('https://api.polyhaven.com/assets?t=models').then(r=>{if(!r.ok)throw Error('catalog');return r.json();});let ids=Object.keys(list).filter(id=>/tree/.test(id)&&!/stump|dead|bark|trunk|branch|log|palm/.test(id));let id=ids.find(x=>/oak/.test(x))||ids[0];if(!id)return;let files=await fetch('https://api.polyhaven.com/files/'+id).then(r=>r.json());let entry=files.gltf?.['1k']?.gltf;let url=entry?.url;if(!url)return;let gl=await gltf.loadAsync(url);let bounds=new T.Box3().setFromObject(gl.scene);let size=bounds.getSize(new T.Vector3());if(!Number.isFinite(size.y)||size.y<.1)return;let center=bounds.getCenter(new T.Vector3());for(let i=0;i<8;i++){let obj=gl.scene.clone(true);let s=(5+i%3)/size.y;obj.scale.setScalar(s);obj.position.set((i%2?-1:1)*12-center.x*s,-bounds.min.y*s,-36+Math.floor(i/2)*24-center.z*s);obj.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});scene.add(obj);}loaded++;report();}catch(e){console.warn('Natural trees unavailable',e);}}naturalTrees();
let night=false;document.querySelector('#day').onclick=()=>{night=!night;sun.intensity=night?.035:3;sky.intensity=night?.18:1.4;scene.background.set(night?0x0b1524:0xa6c0d0);scene.fog.color.copy(scene.background);scene.environmentIntensity=night?.16:.65;mats.warm.emissiveIntensity=night?2.3:0;for(let l of lights)l.intensity=night?160:0;};document.querySelector('#view').onclick=()=>{camera.position.set(28,9,35);controls.target.set(0,4,0);controls.update();};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});report();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
}catch(e){status.textContent='No se pudo iniciar: '+e.message;console.error(e);}
</script></body></html>
