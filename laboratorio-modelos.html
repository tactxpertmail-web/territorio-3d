<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territorio 3D | Laboratorio de modelos</title><style>body{margin:0;background:#182024;color:white;font:15px system-ui}header{padding:12px}canvas{width:100%;height:72vh;touch-action:none}input,button{padding:10px;margin:4px}a{color:#bce5ff}</style><header><strong>Laboratorio independiente de modelos GLB</strong><p>Prueba un archivo GLB local o una URL directa. No modifica la ciudad ni sus partidas.</p><input type="file" id="file" accept=".glb"><input id="url" type="url" placeholder="URL directa del modelo GLB"><button id="load">Cargar URL</button><a href="./index.html">Volver al juego</a><p id="status">Iniciando motor…</p></header><canvas id="canvas"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
const status=document.getElementById('status'), B=window.BABYLON;const engine=new B.Engine(document.getElementById('canvas'),true);let scene, generation=0;function fresh(){const s=new B.Scene(engine);s.clearColor=new B.Color4(.20,.25,.30,1);const c=new B.ArcRotateCamera('camera',-Math.PI/3,Math.PI/3,5,B.Vector3.Zero(),s);c.attachControl(engine.getRenderingCanvas(),true);c.lowerRadiusLimit=.05;c.wheelPrecision=30;const h=new B.HemisphericLight('sky',new B.Vector3(0,1,0),s);h.intensity=.7;const sun=new B.DirectionalLight('sun',new B.Vector3(-1,-2,-1),s);sun.intensity=2;try{s.environmentTexture=B.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env',s);}catch(e){}return s;}scene=fresh();engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());status.textContent='Listo para cargar un modelo.';async function load(source){const id=++generation;let test=fresh();status.textContent='Cargando modelo…';try{let result=await B.SceneLoader.ImportMeshAsync('', '', source,test,undefined,'.glb');if(id!==generation){test.dispose();return;}let meshes=result.meshes.filter(m=>m.getTotalVertices()>0);if(!meshes.length)throw Error('El archivo no contiene geometría');let lo=new B.Vector3(Infinity,Infinity,Infinity),hi=new B.Vector3(-Infinity,-Infinity,-Infinity);for(let m of meshes){m.computeWorldMatrix(true);let bb=m.getBoundingInfo().boundingBox;lo=B.Vector3.Minimize(lo,bb.minimumWorld);hi=B.Vector3.Maximize(hi,bb.maximumWorld);}let size=hi.subtract(lo).length();if(!Number.isFinite(size)||size<=0)throw Error('Dimensiones inválidas');test.activeCamera.setTarget(lo.add(hi).scale(.5));test.activeCamera.radius=size*1.6;test.activeCamera.maxZ=size*100;test.activeCamera.minZ=Math.max(.001,size/10000);await test.whenReadyAsync();if(id!==generation){test.dispose();return;}let previous=scene;scene=test;previous.dispose();status.textContent='Modelo cargado: '+meshes.length+' mallas · '+meshes.reduce((a,m)=>a+m.getTotalVertices(),0)+' vértices · '+test.materials.length+' materiales';}catch(e){test.dispose();if(id===generation)status.textContent='Error: '+e.message+' — la escena anterior permanece intacta.';}}document.getElementById('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0]);};document.getElementById('load').onclick=()=>{let u=document.getElementById('url').value;if(u)load(u);};</script></html>
